services:
  asistodo-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_API_BASE_URL vacío hace que el navegador use URLs relativas (/api/v1/...)
        # las cuales son capturadas por Caddy y redirigidas al backend en BACKEND_URL,
        # evitando cualquier problema de CORS en las PCs de la oficina.
        VITE_API_BASE_URL: ""
    container_name: asistodo-front
    restart: unless-stopped
    ports:
      - "${PORT:-8083}:8083"
    environment:
      # URL del backend (contenedor ticketcoopya-caddy en puerto 8085 por red compartida Docker)
      - BACKEND_URL=${BACKEND_URL:-http://ticketcoopya-caddy:8085}
      # Host header enviado al backend
      - BACKEND_HOST=${BACKEND_HOST:-ticketera.asistodo.com.ar}
      # Origen exacto con protocolo para CORS en el backend
      - FRONTEND_URL=${FRONTEND_URL:-https://admin.asistodo.com.ar}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Permite ajustar el Caddyfile en caliente sin tener que recompilar la imagen (solo lectura)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Volúmenes para datos internos y cache de Caddy
      - caddy_data:/data
      - caddy_config:/config

    # Seguridad: prevención de escalamiento de privilegios
    security_opt:
      - no-new-privileges:true

    # Prevención de agotamiento de disco por logs infinitos
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Monitoreo de salud del servicio para auto-recuperación
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8083/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Control y límites de recursos (prevención de DoS / fuga de memoria al host)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    networks:
      - asistodo-net
      - asistodo_shared_net

networks:
  asistodo-net:
    driver: bridge
  asistodo_shared_net:
    name: asistodo_shared_net
    external: true                           # Red Docker externa compartida con ticketera-backend

volumes:
  caddy_data:
  caddy_config:
