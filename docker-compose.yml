services:
  asistodo-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_API_BASE_URL vacío hace que el navegador use URLs relativas (/api/v1/...)
        # las cuales son capturadas por Caddy y redirigidas al backend en BACKEND_URL,
        # evitando cualquier problema de CORS en las PCs de la oficina.
        VITE_API_BASE_URL: ""
    container_name: asistodo-front
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      # URL del backend principal (Railway) al que Caddy redirigirá las peticiones
      - BACKEND_URL=https://ticketera-backend-production-a834.up.railway.app
    volumes:
      # Permite ajustar el Caddyfile en caliente sin tener que recompilar la imagen
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
